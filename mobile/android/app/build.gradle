apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

def releaseCredential = { String name ->
    providers.gradleProperty(name)
        .orElse(providers.environmentVariable(name))
        .orNull
}
def uploadStorePath = releaseCredential("VOZUAL_UPLOAD_STORE_FILE")
def uploadStorePassword = releaseCredential("VOZUAL_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = releaseCredential("VOZUAL_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = releaseCredential("VOZUAL_UPLOAD_KEY_PASSWORD")
def uploadCredentialValues = [
    uploadStorePath,
    uploadStorePassword,
    uploadKeyAlias,
    uploadKeyPassword,
]
def hasAnyUploadCredential = uploadCredentialValues.any { it != null && !it.isBlank() }
def hasCompleteUploadCredentials = uploadCredentialValues.every { it != null && !it.isBlank() }
def requestedReleaseArtifact = gradle.startParameter.taskNames.any { taskName ->
    def normalized = taskName.toLowerCase()
    normalized.endsWith("bundlerelease") ||
        normalized.endsWith("assemblerelease") ||
        normalized.endsWith("packagereleasebundle") ||
        normalized.endsWith("signreleasebundle")
}

if (hasAnyUploadCredential && !hasCompleteUploadCredentials) {
    throw new GradleException("VOZUAL upload signing credentials are incomplete.")
}
if (requestedReleaseArtifact && !hasCompleteUploadCredentials) {
    throw new GradleException(
        "Release artifacts require VOZUAL_UPLOAD_STORE_FILE, " +
            "VOZUAL_UPLOAD_STORE_PASSWORD, VOZUAL_UPLOAD_KEY_ALIAS and " +
            "VOZUAL_UPLOAD_KEY_PASSWORD. Debug signing is never used for release."
    )
}
if (hasCompleteUploadCredentials &&
        (uploadKeyAlias.equalsIgnoreCase("androiddebugkey") ||
            new File(uploadStorePath).name.equalsIgnoreCase("debug.keystore"))) {
    throw new GradleException("Android debug signing identities are forbidden for release.")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    // package.json lives at mobile/ — two levels up from android/app/
    root = file("../../")
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def configuredArchitectures = (project.findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,arm64-v8a').split(',')
def enableAbiSplits = (project.findProperty('enableAbiSplits') ?: 'false').toBoolean()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.androsja.vozual"
    defaultConfig {
        applicationId "com.androsja.vozual"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.4.0"
    }

    // Keep the regular universal APK for local development. Production can pass
    // -PenableAbiSplits=true so each device downloads only its native libraries.
    splits {
        abi {
            reset()
            enable enableAbiSplits
            universalApk false
            include(*configuredArchitectures)
        }
    }

    androidResources {
        // These legacy assets are not referenced by the current runtime. Keep
        // their source copies available to tooling without shipping them.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:!phonssm.onnx:!vozual_interpreter_base_v1.png:!draco'
    }

    packagingOptions {
        pickFirst 'lib/**/libc++_shared.so'
        pickFirst 'lib/**/libfbjni.so'
        pickFirst 'META-INF/androidx.appcompat_appcompat.version'
        pickFirst 'META-INF/androidx.swiperefreshlayout_swiperefreshlayout.version'
        pickFirst 'META-INF/androidx.*.version'
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasCompleteUploadCredentials) {
            upload {
                storeFile file(uploadStorePath)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            if (!enableAbiSplits) {
                ndk {
                    abiFilters(*configuredArchitectures)
                }
            }
        }
        release {
            signingConfig hasCompleteUploadCredentials ? signingConfigs.upload : null
            ndk {
                abiFilters(*configuredArchitectures)
                debugSymbolLevel "SYMBOL_TABLE"
            }
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

tasks.register("verifyUploadSigningIdentity") {
    group = "verification"
    description = "Rejects missing or Android debug upload signing identities."
    doLast {
        if (!hasCompleteUploadCredentials) {
            throw new GradleException("VOZUAL upload signing credentials are required.")
        }

        def uploadStore = file(uploadStorePath)
        if (!uploadStore.isFile()) {
            throw new GradleException("VOZUAL upload keystore does not exist: ${uploadStore}")
        }

        def certificate = null
        def keyStoreLoadError = null
        ["JKS", "PKCS12"].find { storeType ->
            try {
                def keyStore = java.security.KeyStore.getInstance(storeType)
                uploadStore.withInputStream { stream ->
                    keyStore.load(stream, uploadStorePassword.toCharArray())
                }
                certificate = keyStore.getCertificate(uploadKeyAlias)
                return certificate != null
            } catch (Exception error) {
                keyStoreLoadError = error
                return false
            }
        }
        if (certificate == null) {
            throw new GradleException(
                "VOZUAL upload alias was not found in a JKS or PKCS12 keystore.",
                keyStoreLoadError,
            )
        }
        if (certificate instanceof java.security.cert.X509Certificate &&
                certificate.subjectX500Principal.name.contains("CN=Android Debug")) {
            throw new GradleException("Android debug certificates are forbidden for release.")
        }
    }
}

// Validate release invariants without shadowing AGP's generated test task.
tasks.register("verifyReleaseUnitTestConfiguration") {
    group = "verification"
    description = "Validates security-critical release build-type invariants."
    doLast {
        def releaseBuild = android.buildTypes.getByName("release")
        if (releaseBuild.debuggable) {
            throw new GradleException("Release must not be debuggable.")
        }
        if (!releaseBuild.minifyEnabled || !releaseBuild.shrinkResources) {
            throw new GradleException("Release code and resource shrinking must remain enabled.")
        }
        if (releaseBuild.signingConfig?.name == "debug") {
            throw new GradleException("Release must never use the debug signing config.")
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ["bundleRelease", "assembleRelease", "signReleaseBundle"]) {
        task.dependsOn("verifyUploadSigningIdentity")
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-ktx:1.17.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Google MediaPipe Tasks Vision API (Modern)
    implementation("com.google.mediapipe:tasks-vision:1.0.0")
}
